[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paladin-engine"
version = "0.1.0"
description = "Paladin Context and Intent Analysis Engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.10.6",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["paladin*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["paladin/tests"]
